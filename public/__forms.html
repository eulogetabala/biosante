<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Formulaire — Bio Santé Diagnostic</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Squelette de détection Netlify Forms.

      Netlify lit le HTML statique produit au déploiement : un <form> déclaré
      dans un composant React (page pré-rendue puis servie par Next) lui est
      invisible, et les envois échouent en silence. Ce fichier existe pour ça.

      Les champs listés ici définissent ce que Netlify accepte de transmettre au
      webhook sortant. Un champ absent de ce fichier est purement et simplement
      ignoré à la réception.

      En ajoutant un champ au formulaire, l'ajouter DANS LES DEUX FICHIERS :
      ce squelette et components/sections/AppointmentCard.tsx.
    -->
    <form name="rendez-vous" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rendez-vous" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="dial" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <input type="text" name="labo" />
      <input type="date" name="date" />
      <input type="time" name="time" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
